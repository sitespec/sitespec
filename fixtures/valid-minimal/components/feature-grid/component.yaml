specVersion: "0.1"
component:
  id: feature-grid
  role: content
variants: [default]
themes: [default, muted]
props:
  type: object
  additionalProperties: false
  required: [title, items]
  properties:
    title:
      type: string
    items:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: [title, text]
        properties:
          title: { type: string }
          text: { type: string }
rules:
  allowedArchetypes: [marketing, detail]
