specVersion: "0.4"
page:
  id: post
  route: /blog/[slug]
  archetype: article

content:
  entry: posts

seo:
  title: "{entry.title}"
  description: "{entry.description}"

sections:
  - id: article
    use: article
    props:
      title:
        $ref: entry:title
      description:
        $ref: entry:description
      date:
        $ref: entry:date
      body:
        $ref: entry:body
      author:
        $ref: entry:author
      categories:
        $ref: entry:categories
      tags:
        $ref: entry:tags
