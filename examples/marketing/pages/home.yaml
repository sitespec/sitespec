specVersion: "0.4"
page:
  id: home
  route: /
  archetype: marketing

content:
  queries:
    featured:
      collection: posts
      filter:
        - field: featured
          eq: true
      sort:
        - field: date
          order: desc

seo:
  title: Home
  description: SiteSpec v0.4 content showcase with typed collections, relations, filters, and generated routes.

sections:
  - id: intro
    use: hero
    variant: split
    props:
      eyebrow: SiteSpec v0.4 Content
      title: Build the content model in files, not in component code
      text: This example uses typed Markdown collections, generic relations, declarative filters, sorting, pagination, draft state, and content-driven routes.
      primaryAction:
        label: Read the blog
        href: /blog

  - id: featured
    use: post-list
    theme: muted
    props:
      title: Featured posts — filtered in Page Spec
      items:
        $ref: query:featured.items

  - id: final-cta
    $ref: section:final-cta
