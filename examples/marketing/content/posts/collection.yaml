specVersion: "0.3"
collection:
  id: posts
entry:
  schema:
    type: object
    additionalProperties: false
    required: [title, description, author, categories, tags, featured]
    properties:
      title: { type: string }
      description: { type: string }
      author: { type: string }
      categories:
        type: array
        minItems: 1
        items: { type: string }
      tags:
        type: array
        minItems: 1
        items: { type: string }
      featured: { type: boolean }
relations:
  author:
    collection: authors
  categories:
    collection: categories
    many: true
  tags:
    collection: tags
    many: true
