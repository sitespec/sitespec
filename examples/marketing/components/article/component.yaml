specVersion: "0.3"
component:
  id: article
  role: content

description: Render a post entry with resolved author/category/tag relations.
variants: [default]
themes: [default]
props:
  type: object
  additionalProperties: false
  required: [title, description, date, body, author, categories, tags]
  properties:
    title: { type: string }
    description: { type: string }
    date: { type: string }
    body:
      type: object
      additionalProperties: false
      required: [format, source, html]
      properties:
        format: { const: markdown }
        source: { type: string }
        html: { type: string }
    author:
      type: object
      required: [id, name, href]
      properties:
        id: { type: string }
        name: { type: string }
        href: { type: string }
    categories:
      type: array
      minItems: 1
      items:
        type: object
        required: [id, name, href]
        properties:
          id: { type: string }
          name: { type: string }
          href: { type: string }
    tags:
      type: array
      minItems: 1
      items:
        type: object
        required: [id, name, href]
        properties:
          id: { type: string }
          name: { type: string }
          href: { type: string }
runtime:
  javascript: false
rules:
  allowedArchetypes: [article, detail]
semantics:
  pageHeading: true
