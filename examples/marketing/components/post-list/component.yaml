specVersion: "0.5"
component:
  id: post-list
  role: content

description: Render resolved post query items, including relation data.
variants: [default]
themes: [default, muted]
props:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    title:
      type: string
      maxLength: 90
    items:
      type: array
      minItems: 1
      items:
        type: object
        required: [id, title, description, href, author]
        properties:
          id: { type: string }
          title: { type: string }
          description: { type: string }
          href: { type: string }
          date: { type: string }
          author:
            type: object
            required: [id, name, href]
            properties:
              id: { type: string }
              name: { type: string }
              href: { type: string }
runtime:
  javascript: false
rules:
  allowedArchetypes: [marketing, listing, blank]
