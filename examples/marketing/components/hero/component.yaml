specVersion: "0.5"
component:
  id: hero
  role: intro

description: Primary introduction section.

variants:
  - default
  - centered
  - split

themes:
  - default
  - muted
  - inverted

props:
  type: object
  additionalProperties: false
  required:
    - title
  properties:
    eyebrow:
      type: string
      maxLength: 40
    title:
      type: string
      maxLength: 90
    text:
      type: string
      maxLength: 240
    primaryAction:
      $ref: urn:site-spec:0.5:type:action
    image:
      $ref: urn:site-spec:0.5:type:image

rules:
  maxPerPage: 1
  allowedArchetypes:
    - marketing
    - detail
    - listing
  placement: first

semantics:
  pageHeading: true
