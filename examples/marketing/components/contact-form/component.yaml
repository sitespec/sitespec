specVersion: "0.7"
component:
  id: contact-form
  role: conversion

description: Contact form composition built from the exported SiteSpec form primitives.

variants:
  - default

themes:
  - default
  - muted

props:
  type: object
  additionalProperties: false
  required:
    - title
    - submitLabel
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 90
    description:
      type: string
      maxLength: 320
    submitLabel:
      type: string
      minLength: 1
      maxLength: 80
    note:
      type: string
      maxLength: 320

runtime:
  javascript: false

rules:
  allowedArchetypes:
    - marketing
    - detail
