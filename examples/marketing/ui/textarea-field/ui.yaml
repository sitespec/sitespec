specVersion: "0.7"
ui:
  id: textarea-field
  role: form

description: Labeled multiline form field with description, validation, readonly, and disabled states.

variants:
  - default

states:
  - default
  - hover
  - focus-visible
  - invalid
  - readonly
  - disabled

props:
  type: object
  additionalProperties: false
  required: [label, name]
  properties:
    id: { type: string, minLength: 1 }
    label: { type: string, minLength: 1, maxLength: 160 }
    name: { type: string, minLength: 1, maxLength: 120 }
    value: { type: string, maxLength: 5000 }
    placeholder: { type: string, maxLength: 500 }
    description: { type: string, maxLength: 500 }
    error: { type: string, maxLength: 500 }
    rows: { type: integer, minimum: 2, maximum: 20 }
    required: { type: boolean }
    readonly: { type: boolean }
    disabled: { type: boolean }

runtime:
  javascript: false
