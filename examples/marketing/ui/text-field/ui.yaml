specVersion: "0.7"
ui:
  id: text-field
  role: form

description: Labeled single-line form field with description, validation, readonly, and disabled states.

variants:
  - default

states:
  - default
  - hover
  - focus-visible
  - invalid
  - readonly
  - disabled

props:
  type: object
  additionalProperties: false
  required: [label, name]
  properties:
    id:
      type: string
      minLength: 1
    label:
      type: string
      minLength: 1
      maxLength: 160
    name:
      type: string
      minLength: 1
      maxLength: 120
    type:
      enum: [text, email, password, search, tel, url]
    value:
      type: string
      maxLength: 500
    placeholder:
      type: string
      maxLength: 200
    description:
      type: string
      maxLength: 500
    error:
      type: string
      maxLength: 500
    autocomplete:
      type: string
      maxLength: 120
    required:
      type: boolean
    readonly:
      type: boolean
    disabled:
      type: boolean

runtime:
  javascript: false
