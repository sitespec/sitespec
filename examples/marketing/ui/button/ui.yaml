specVersion: "0.7"
ui:
  id: button
  role: action

description: Primary and secondary action primitive that renders an anchor when href is provided and a native button otherwise.

variants:
  - default
  - primary
  - secondary

states:
  - default
  - hover
  - active
  - focus-visible
  - disabled

props:
  type: object
  additionalProperties: false
  required:
    - label
  properties:
    label:
      type: string
      minLength: 1
      maxLength: 80
    href:
      type: string
      minLength: 1
    target:
      enum: [self, blank]
    type:
      enum: [button, submit, reset]
    disabled:
      type: boolean

runtime:
  javascript: false
