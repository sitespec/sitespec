name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  NODE_VERSION: "24"
  NPM_VERSION: "11.19.1"

jobs:
  select:
    name: Select release mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Verify package lock
        run: node scripts/verify-lockfile.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata
        run: npm run release:verify

      - name: Select Changesets mode
        id: mode
        uses: changesets/action/select-mode@v2.1.1

  version:
    name: Create or update version PR
    if: needs.select.outputs.mode == 'version'
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run release:check

      - name: Create or update version PR
        uses: changesets/action/version@v2.1.1
        with:
          github-token: ${{ github.token }}
          script: npm run release:version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    name: Publish to npm
    if: needs.select.outputs.mode == 'publish' && vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run release:check

      - name: Publish packages and create GitHub releases
        uses: changesets/action/publish@v2.1.1
        with:
          github-token: ${{ github.token }}
          script: npm run release:publish
          create-github-releases: true
          push-git-tags: true
