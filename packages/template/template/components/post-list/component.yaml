specVersion: "0.4"
component:
  id: post-list
  role: content

description: Render entries from a typed content query.

variants:
  - default

themes:
  - default
  - muted

props:
  type: object
  additionalProperties: false
  required:
    - items
  properties:
    title:
      type: string
      maxLength: 90
    items:
      type: array
      minItems: 1
      maxItems: 12
      items:
        type: object
        required:
          - id
          - title
          - href
        properties:
          id:
            type: string
          title:
            type: string
          description:
            type: string
          href:
            type: string
          date:
            type: string

runtime:
  javascript: false

rules:
  allowedArchetypes:
    - marketing
    - listing
    - blank
