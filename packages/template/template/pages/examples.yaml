specVersion: "0.2"
page:
  id: examples
  route: /examples
  archetype: listing

seo:
  title: Examples
  description: A SiteSpec v0.2 listing page demonstrating the pagination core type with static URLs.

sections:
  - id: intro
    use: hero
    variant: split
    props:
      eyebrow: Core type
      title: Pagination is static navigation
      text: Each page has its own generated URL and receives a standard v0.2 pagination object. No client-side router is required.

  - id: examples
    use: feature-grid
    props:
      title: Page 1 — the pagination contract
      items:
        - title: Typed input
          text: currentPage, totalPages and page links are validated against urn:site-spec:0.2:type:pagination.
        - title: Static URLs
          text: Page links target generated routes, so navigation works in a static build and on GitHub Pages.
        - title: Zero client runtime
          text: Pagination is rendered as ordinary links and does not require client JavaScript to update its state.

  - id: pagination
    use: pagination
    props:
      currentPage: 1
      totalPages: 3
      nextHref: /examples/page/2
      pages:
        - page: 1
          href: /examples
          current: true
        - page: 2
          href: /examples/page/2
        - page: 3
          href: /examples/page/3
