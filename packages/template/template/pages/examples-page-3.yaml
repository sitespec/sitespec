specVersion: "0.2"
page:
  id: examples-page-3
  route: /examples/page/3
  archetype: listing

seo:
  title: Examples — Page 3
  description: Page 3 of the SiteSpec v0.2 static pagination example.

sections:
  - id: intro
    use: hero
    variant: split
    props:
      eyebrow: Core type
      title: Static pagination reaches a real final page
      text: Page 3 completes the example. Previous remains available, the current numbered link changes, and Next is disabled by omission.

  - id: examples
    use: feature-grid
    props:
      title: Page 3 — no hidden runtime state
      items:
        - title: Final page
          text: nextHref is omitted, so the renderer exposes Next as disabled instead of inventing another destination.
        - title: Portable output
          text: Every state is encoded in HTML and ordinary links, which works without hydration or a client router.
        - title: Base-path safe
          text: The renderer rebases pagination href fields when the site is deployed below a repository path.

  - id: pagination
    use: pagination
    props:
      currentPage: 3
      totalPages: 3
      previousHref: /examples/page/2
      pages:
        - page: 1
          href: /examples
        - page: 2
          href: /examples/page/2
        - page: 3
          href: /examples/page/3
          current: true
