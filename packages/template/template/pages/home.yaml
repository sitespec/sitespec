specVersion: "0.5"
page:
  id: home
  route: /
  archetype: marketing

seo:
  title: Home
  description: A compact SiteSpec v0.5 starter demonstrating composition and typed content end to end.

sections:
  - id: intro
    use: hero
    variant: split
    props:
      eyebrow: SiteSpec 0.5
      title: The specification and content are the source of truth
      text: This starter demonstrates a first-class Design System with themes, reusable sections and UI primitives alongside typed Markdown content, content-driven routes, local fonts, semantic assets and agent inspection.
      primaryAction:
        label: Explore the content example
        href: /blog
      image:
        src: /media/hero.png
        alt: Abstract SiteSpec media pipeline preview
        widths: [480, 720, 960]
        sizes: "(max-width: 760px) 100vw, 42vw"
        crop:
          aspectRatio: "4:3"
          focalPoint:
            x: 0.5
            y: 0.5
        loading: eager
        fetchPriority: high

  - id: features
    use: feature-grid
    props:
      title: One small site, the SiteSpec Design System, composition and content model
      items:
        - title: Typed content
          text: Markdown entries under content/posts are validated against a collection schema before they can feed pages.
        - title: Content-driven routes
          text: pages/post.yaml binds /blog/[slug] to the posts collection, so entries materialize static detail routes automatically.
        - title: Declarative queries
          text: The blog listing sorts and paginates posts in Page Spec; Astro components only render the resolved props.
        - title: First-class Design System
          text: design-system.yaml exports UI and section libraries, themes, shell packs, layout conventions and controlled token extensions.
        - title: Dynamic routes
          text: The feature example still demonstrates explicit page.paths and param:slug for non-content route expansion.
        - title: Agent protocol
          text: The CLI exposes routes, collections, entries, components, UI primitives, assets, fonts and navigation as inspectable JSON.

  - id: explore
    use: navigation-list
    variant: inline
    props:
      title: Explore the starter
      items:
        $ref: navigation:primary

  - id: final-cta
    $ref: section:final-cta
